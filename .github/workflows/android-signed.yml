name: Publish signed Android release (optional)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag/release, such as v0.2.0
        required: true
        type: string
permissions:
  contents: write
jobs:
  signed-android:
    name: Sign Android AAB and APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Validate signing configuration and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing signing secrets' >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/calculator2-release.jks"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: python scripts/vendor_pyodide.py
      - run: npm run build:native
      - run: npx cap add android
      - run: npx cap sync android
      - name: Sign installable release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap build android --androidreleasetype APK \
            --keystorepath "$RUNNER_TEMP/calculator2-release.jks" \
            --keystorepass "$KEYSTORE_PASSWORD" --keystorealias "$KEY_ALIAS" \
            --keystorealiaspass "$KEY_PASSWORD"
      - name: Sign Play Store AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap build android --androidreleasetype AAB \
            --keystorepath "$RUNNER_TEMP/calculator2-release.jks" \
            --keystorepass "$KEYSTORE_PASSWORD" --keystorealias "$KEY_ALIAS" \
            --keystorealiaspass "$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: calculator2-android-signed
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Attach signed assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ inputs.tag }}' \
            android/app/build/outputs/apk/release/*.apk \
            android/app/build/outputs/bundle/release/*.aab \
            --repo '${{ github.repository }}' --clobber
