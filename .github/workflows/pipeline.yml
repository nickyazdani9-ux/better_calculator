name: Cross-platform CI and builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install 'sympy>=1.13,<2' 'pytest>=8,<10' 'pyyaml>=6,<7'
      - run: npm run test:js
      - run: python -m pytest tests/test_*.py -q
        shell: bash
      - run: python scripts/export_catalog.py
      - run: git diff --exit-code -- assets/catalog.json

  web:
    name: Web / installable PWA / browser integration
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: python scripts/vendor_pyodide.py
      - run: npm run build:native
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: calculator2-web
          path: dist/
          retention-days: 14

  android:
    name: Android universal APK + AAB
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: python scripts/vendor_pyodide.py
      - run: npm run build:native
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build installable debug APK and unsigned release AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: calculator2-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  ios:
    name: iOS Simulator (${{ matrix.arch }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.0'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: python scripts/vendor_pyodide.py
      - run: npm run build:native
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Compile unsigned simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Calculator2Derived" \
            ARCHS='${{ matrix.arch }}' ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Calculator2Derived/Build/Products/Debug-iphonesimulator/App.app" \
            "calculator2-ios-simulator-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: calculator2-ios-simulator-${{ matrix.arch }}
          path: calculator2-ios-simulator-${{ matrix.arch }}.zip
          retention-days: 14

  desktop:
    name: Desktop (${{ matrix.os }} / ${{ matrix.arch }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
          - os: windows-11-arm
            platform: win
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm install --no-audit --no-fund
      - run: python scripts/vendor_pyodide.py
      - run: npm run build:native
      - name: Package Electron shell
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: calculator2-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/desktop/
          retention-days: 14

  deploy-pages:
    name: Deploy tested PWA
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: calculator2-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calculator2-web
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
      - id: deployment
        uses: actions/deploy-pages@v4

  github-release:
    name: Publish unsigned preview builds
    needs: [web, android, ios, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release assets
        shell: bash
        run: |
          mkdir -p publish
          for dir in artifacts/calculator2-*; do
            [ -d "$dir" ] || continue
            name="${dir#artifacts/}"
            (cd "$dir" && zip -q -r "../../publish/${name}.zip" .)
          done
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' publish/* \
            --repo '${{ github.repository }}' --prerelease \
            --title 'Calculator 2.0 ${{ github.ref_name }}' \
            --notes 'CI-generated preview builds. Android debug APK is installable; AAB and iOS simulator app are unsigned. Apple real-device releases and store distribution require signing.'
